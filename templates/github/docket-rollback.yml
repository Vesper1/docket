# Docket — create a compensating pull request from one successful deployment.
#
# The workflow only creates Git objects and a PR. Salesforce credentials are
# deliberately absent: validation, manual merge, and deployment happen through
# the ordinary Docket validate/deploy workflows.
name: Docket rollback PR

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Workflow run ID that holds the successful deployment artifact
        required: true
        type: number
      artifact_name:
        description: Exact docket-deployment-* artifact name from that run
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  # The vendored engine, committed to this repository. It is read from a
  # trusted commit rather than installed, so no registry or token is
  # involved. `DOCKET` itself is set by the step that materializes it.
  DOCKET_ENGINE: .docket/docket.mjs

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The engine is executable configuration, so it is read from a
      # commit that was already reviewed — never from the candidate's
      # checkout, which sits in this same workspace. This is the rule
      # `docket.yml` already follows.
      - name: Materialize the trusted Docket engine
        env:
          DOCKET_ENGINE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$DOCKET_ENGINE_REF:$DOCKET_ENGINE" 2>/dev/null; then
            echo "Commit $DOCKET_ENGINE_REF does not contain $DOCKET_ENGINE. Vendor the engine bundle into the repository first." >&2
            exit 1
          fi
          git show "$DOCKET_ENGINE_REF:$DOCKET_ENGINE" > "$RUNNER_TEMP/docket.mjs"
          # Printed so a run can be tied to one exact engine build.
          sha256sum "$RUNNER_TEMP/docket.mjs"
          echo "DOCKET=node $RUNNER_TEMP/docket.mjs" >> "$GITHUB_ENV"

      - name: Retrieve the exact recorded deployment
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/docket-source
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Build one inverse commit and open its pull request
        env:
          # A GitHub App installation token or fine-grained PAT makes the
          # resulting pull_request workflow run automatically. The repository
          # GITHUB_TOKEN fallback is safe, but GitHub may require a maintainer
          # to approve the generated validation run.
          GITHUB_TOKEN: ${{ secrets.DOCKET_PR_TOKEN || github.token }}
        run: |
          $DOCKET rollback \
            --repo "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --run "$RUNNER_TEMP/docket-source" \
            --create-pr \
            --out "$RUNNER_TEMP/docket-rollback"

      - name: Upload the reviewable rollback calculation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docket-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/docket-rollback
          if-no-files-found: warn
