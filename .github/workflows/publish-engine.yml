# Docket — publish the engine a Salesforce repository can pin.
#
# This is the only workflow of the engine repository itself. It exists because
# `DOCKET_PACKAGE` must name one exact, already-built engine: `dist/` is not in
# Git, so nothing downstream may be trusted to build it.
#
# Tag a commit `v<version>` matching `package.json`, and that tag becomes an
# immutable version on npm.
name: Publish engine

on:
  push:
    tags: ['v*']
  # Publishing by hand is allowed too, so a first live run does not need a tag.
  workflow_dispatch:

permissions:
  contents: read
  # Signs the published version with provenance pointing back at this workflow
  # and commit, so a consumer can verify what its pinned engine was built from.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      # A published version is what other repositories deploy with, so it is
      # verified before it exists, not after.
      - name: Verify the engine
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm test

      - name: Require the tag to name the published version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $declared." >&2
            exit 1
          fi

      # `NPM_TOKEN` is an automation token for the @vesper1 scope. Configuring
      # this workflow as a trusted publisher on npm replaces it with the OIDC
      # identity `id-token: write` already grants.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance
