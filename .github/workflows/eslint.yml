# ESLint is no longer a pull request gate: the Code Analyzer workflow runs the
# same rules from eslint.config.mjs alongside PMD, Flow, and Regex. This
# workflow stays dispatchable so the engine can be run on its own when a
# Code Analyzer result needs to be reproduced against plain ESLint.
name: ESLint

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_code_changes:
    uses: ./.github/workflows/detect-code-changes.yml
    with:
      base: ${{ github.event.repository.default_branch }}

  eslint:
    needs: detect_code_changes
    if: needs.detect_code_changes.outputs.has_js_ts_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test scripts
        run: npm test

      - name: Lint changed code
        env:
          JS_TS_FILES: ${{ needs.detect_code_changes.outputs.js_ts_files }}
        run: node .github/scripts/quality-gates/eslint/check.mjs
