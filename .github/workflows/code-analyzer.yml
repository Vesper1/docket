name: Code Analyzer

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_code_changes:
    uses: ./.github/workflows/detect-code-changes.yml

  code_analyzer:
    needs: detect_code_changes
    if: needs.detect_code_changes.outputs.has_analyzable_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # PMD rules run on a JVM and the Flow Scanner runs on Python. A missing
      # runtime does not skip an engine: Code Analyzer reports it as a Critical
      # violation, so the gate fails without ever looking at the code.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The ESLint engine loads eslint.config.mjs from the checkout, which
      # imports plugins from node_modules.
      - name: Install dependencies
        run: npm ci

      - name: Test scripts
        run: npm test

      # Pinned to majors: a new Code Analyzer major reshuffles rule names and
      # tags, which silently changes what the gate blocks.
      - name: Install Salesforce Code Analyzer
        run: |
          npm install --global @salesforce/cli@2
          sf plugins install code-analyzer@5

      - name: Analyze changed code
        env:
          CODE_FILES: ${{ needs.detect_code_changes.outputs.analyzable_files }}
        run: node .github/scripts/quality-gates/code-analyzer/check.mjs

      - name: Upload the analyzer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-results
          path: code-analyzer-results.*
          if-no-files-found: ignore
