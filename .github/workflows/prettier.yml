name: Prettier

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_code_changes:
    uses: ./.github/workflows/detect-code-changes.yml

  prettier:
    needs: detect_code_changes
    if: needs.detect_code_changes.outputs.has_code_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test scripts
        run: npm test

      - name: Check changed code formatting
        env:
          CODE_FILES: ${{ needs.detect_code_changes.outputs.code_files }}
        run: node .github/scripts/quality-gates/prettier/check.mjs
