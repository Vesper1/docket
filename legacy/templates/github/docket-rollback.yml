# Docket — deploy the inverse of a change, restoring the base commit.
#
# Same two commits as the deployment being undone: the engine inverts the
# component set and deploys the base commit's tree. What was added is deleted,
# what was deleted or modified is restored to the bytes the deployment started
# from.
#
# This does not touch Git. The repository still holds the change; only the org
# is put back. Reverting the code is a separate, ordinary pull request.
name: Docket rollback

on:
  workflow_dispatch:
    inputs:
      base:
        description: Full SHA of the base commit of the deployment being undone
        required: true
        type: string
      head:
        description: Full SHA of its head commit
        required: true
        type: string
      check_only:
        description: Ask Salesforce to check the rollback without changing the org
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Shares the deployment's group: a rollback and a deployment must never reach
# the same org at once.
concurrency:
  group: docket-deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install the Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to the org
        env:
          SF_AUTH_URL: ${{ secrets.DOCKET_SF_AUTH_URL }}
        run: |
          set -euo pipefail
          printf '%s' "$SF_AUTH_URL" > "$RUNNER_TEMP/auth.txt"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/auth.txt" --alias docket-qa
          rm -f "$RUNNER_TEMP/auth.txt"

      - name: Roll back
        run: |
          set -euo pipefail
          node .docket/docket.mjs rollback \
            --base "${{ inputs.base }}" \
            --head "${{ inputs.head }}" \
            --out "$RUNNER_TEMP/docket-run" \
            ${{ inputs.check_only && '--check-only' || '' }}

      - name: Upload the run artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: docket-rollback-${{ inputs.head }}
          path: ${{ runner.temp }}/docket-run
          if-no-files-found: warn
