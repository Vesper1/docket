# Docket — rebuild a bounded deployment history from retained run artifacts.
#
# Supply exact Docket deploy workflow run IDs. This is an audit projection, not
# a database: expired or omitted artifacts are outside the resulting history.
name: Docket deployment history

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: JSON array of Docket deploy workflow run IDs
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  # The vendored engine, committed to this repository. It is read from a
  # trusted commit rather than installed, so no registry or token is
  # involved. `DOCKET` itself is set by the step that materializes it.
  DOCKET_ENGINE: .docket/docket.mjs

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted commit that carries the engine
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # A local action is loaded from the workspace, so the checkout above has
      # to be the trusted commit itself. A candidate checkout belongs in a
      # sibling directory, never at the workspace root.
      - name: Materialize the trusted Docket engine
        uses: ./.github/actions/docket-engine
        with:
          ref: ${{ github.sha }}
          engine: ${{ env.DOCKET_ENGINE }}

      - name: Retrieve the exact deployment artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.run_ids }}
        run: |
          set -euo pipefail
          echo "$RUN_IDS" | jq -e 'type == "array" and length > 0 and all(.[]; type == "number" and . > 0 and floor == .)' > /dev/null
          mkdir -p "$RUNNER_TEMP/docket-history-input"
          echo "$RUN_IDS" | jq -r '.[]' | while IFS= read -r run_id; do
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'docket-deployment-*' \
              --dir "$RUNNER_TEMP/docket-history-input/$run_id"
          done

      - name: Verify every bundle and build the history
        run: |
          $DOCKET history \
            --runs "$RUNNER_TEMP/docket-history-input" \
            --out "$RUNNER_TEMP/docket-history"

      - name: Upload the bounded history projection
        uses: actions/upload-artifact@v5
        with:
          name: docket-history-${{ github.run_id }}
          path: ${{ runner.temp }}/docket-history
          if-no-files-found: error
